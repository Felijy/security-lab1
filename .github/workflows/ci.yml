name: Secure API CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p reports
      - name: API tests
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Bandit SAST
        if: ${{ !cancelled() }}
        run: python -m bandit -r app -f json -o reports/bandit.json
      - name: Python dependency audit
        if: ${{ !cancelled() }}
        run: python -m pip_audit -r requirements-dev.txt -f json -o reports/pip-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: tests-and-security
          path: reports/
          if-no-files-found: error

  owasp-sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: |
          mkdir -p dependency-scan reports
          cp requirements.txt dependency-scan/requirements.txt
      - name: OWASP Dependency-Check SCA
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: security-lab1
          path: dependency-scan
          format: ALL
          out: reports/owasp
          args: --enableExperimental --failOnCVSS 7 --disableOssIndex --suppression /github/workspace/dependency-check-suppressions.xml
      - name: Check dependency inventory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {line.lower() for line in Path("requirements.txt").read_text().splitlines() if line.strip()}
          report = json.loads(Path("reports/owasp/dependency-check-report.json").read_text())
          actual = {f"{item.get('name', '')}=={item.get('version', '')}".lower() for item in report["dependencies"]}
          if not expected <= actual:
              raise SystemExit(f"Dependencies missing from OWASP report: {expected - actual}")
          print(f"OWASP checked {len(expected)} dependencies")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: owasp-report
          path: reports/
          if-no-files-found: error
