name: Secure API CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p reports
      - name: API tests
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Bandit SAST
        if: ${{ !cancelled() }}
        run: python -m bandit -r app -f json -o reports/bandit.json
      - name: Python dependency audit
        if: ${{ !cancelled() }}
        run: python -m pip_audit -r requirements-dev.txt -f json -o reports/pip-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: tests-and-security
          path: reports/
          if-no-files-found: error

  snyk-sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Snyk token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Add SNYK_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
        with:
          snyk-version: v1.1308.3
      - name: Snyk SCA
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p reports
          snyk test --file=requirements-dev.txt --package-manager=pip --command=python --ignore-policy --json-file-output=reports/snyk.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && hashFiles('reports/snyk.json') != '' }}
        with:
          name: snyk-report
          path: reports/snyk.json
          if-no-files-found: error
